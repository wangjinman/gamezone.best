<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#3ecf8e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="#6c63ff" opacity="0.08"/>
  <circle cx="150" cy="530" r="140" fill="#3ecf8e" opacity="0.08"/>
  <circle cx="950" cy="550" r="100" fill="#6c63ff" opacity="0.05"/>

  <!-- Top accent bar -->
  <rect x="100" y="60" width="200" height="5" rx="3" fill="url(#accent)"/>

  <!-- Game controller icon (simplified) -->
  <g transform="translate(100, 180)">
    <rect x="0" y="20" width="120" height="70" rx="35" fill="none" stroke="#6c63ff" stroke-width="4" opacity="0.6"/>
    <circle cx="85" cy="45" r="8" fill="#6c63ff" opacity="0.7"/>
    <circle cx="105" cy="55" r="8" fill="#3ecf8e" opacity="0.7"/>
    <circle cx="85" cy="65" r="8" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="65" cy="55" r="8" fill="#ffd93d" opacity="0.7"/>
    <rect x="28" y="48" width="18" height="4" rx="2" fill="#888" opacity="0.6"/>
    <rect x="34" y="42" width="4" height="18" rx="2" fill="#888" opacity="0.6"/>
  </g>

  <!-- Main title -->
  <text x="100" y="330" font-family="Arial, sans-serif" font-size="96" font-weight="900" fill="white" letter-spacing="-2">GameZone</text>

  <!-- Subtitle -->
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="36" fill="#a0a0c0" letter-spacing="1">1000+ Free HTML5 Games · No Download · Play Instantly</text>

  <!-- Category tags -->
  <g transform="translate(100, 440)">
    <rect x="0" y="0" width="130" height="44" rx="22" fill="#6c63ff" opacity="0.3"/>
    <text x="65" y="28" font-family="Arial, sans-serif" font-size="18" fill="#a0a0ff" text-anchor="middle">Action</text>

    <rect x="148" y="0" width="130" height="44" rx="22" fill="#3ecf8e" opacity="0.25"/>
    <text x="213" y="28" font-family="Arial, sans-serif" font-size="18" fill="#3ecf8e" text-anchor="middle">Puzzle</text>

    <rect x="296" y="0" width="130" height="44" rx="22" fill="#ff6b6b" opacity="0.25"/>
    <text x="361" y="28" font-family="Arial, sans-serif" font-size="18" fill="#ff9999" text-anchor="middle">Racing</text>

    <rect x="444" y="0" width="130" height="44" rx="22" fill="#ffd93d" opacity="0.2"/>
    <text x="509" y="28" font-family="Arial, sans-serif" font-size="18" fill="#ffd93d" text-anchor="middle">Sports</text>

    <rect x="592" y="0" width="150" height="44" rx="22" fill="#6c63ff" opacity="0.2"/>
    <text x="667" y="28" font-family="Arial, sans-serif" font-size="18" fill="#a0a0ff" text-anchor="middle">Adventure</text>
  </g>

  <!-- Domain badge -->
  <rect x="900" y="530" width="200" height="50" rx="25" fill="url(#accent)" opacity="0.9"/>
  <text x="1000" y="562" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">gamezone.best</text>
</svg>
